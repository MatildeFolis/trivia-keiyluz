<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>¿Cuál es cuál? — Keila y Luz</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Quicksand:wght@300;400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#ffffff;display:flex;align-items:center;justify-content:center;font-family:'Quicksand',sans-serif;padding:20px}
.card{background:#fff;max-width:420px;width:100%;overflow:hidden;box-shadow:0 2px 40px rgba(0,0,0,0.07);border:1px solid #c2dce8}
.hdr{background:#fff;padding:48px 32px 36px;text-align:center;border-bottom:1px solid #c2dce8}
.hdr::after{content:'';display:block;width:40px;height:1.5px;background:#5aace6;margin:20px auto 0}
.nom{font-family:'Playfair Display',serif;font-size:38px;font-weight:400;color:#3a8abf;letter-spacing:2px;line-height:1.2}
.subtit{font-family:'Quicksand',sans-serif;font-size:11px;font-weight:500;color:#3a8abf;letter-spacing:5px;text-transform:uppercase;margin-bottom:10px;opacity:0.7}
.tagline{font-family:'Playfair Display',serif;font-style:italic;font-size:15px;color:#aaa;margin-top:20px;line-height:1.6}
.body{padding:32px}
.cta{background:#3a8abf;color:#fff;border:none;width:100%;padding:16px;font-family:'Quicksand',sans-serif;font-size:11px;font-weight:600;letter-spacing:4px;text-transform:uppercase;cursor:pointer}
.cta2{background:transparent;color:#3a8abf;border:1px solid #3a8abf;width:100%;padding:14px;font-family:'Quicksand',sans-serif;font-size:10px;font-weight:600;letter-spacing:3px;text-transform:uppercase;cursor:pointer;margin-top:12px}
.thdr{background:#3a8abf;padding:24px 32px;display:flex;align-items:center;justify-content:space-between}
.ttit{font-family:'Playfair Display',serif;font-size:20px;color:#fff;font-weight:400}
.tnum{font-family:'Quicksand',sans-serif;font-size:10px;color:rgba(255,255,255,0.7);letter-spacing:2px}
.pbar{height:2px;background:#c2dce8}
.pfill{height:2px;background:#3a8abf;transition:width 0.4s}
.pbody{padding:32px}
.ptxt{font-family:'Playfair Display',serif;font-size:22px;color:#3a8abf;line-height:1.5;margin-bottom:24px}
.obtn{display:block;width:100%;text-align:left;padding:14px 18px;border:1px solid #c2dce8;background:#fff;font-family:'Quicksand',sans-serif;font-size:14px;font-weight:500;color:#333;cursor:pointer;margin-bottom:10px}
.obtn:hover{border-color:#3a8abf;background:#eef6fb}
.ok{border-color:#3a8abf!important;background:#dff0f9!important;color:#3a8abf!important}
.no{border-color:#c62828!important;background:#fdf1f1!important;color:#c62828!important}
.sig{background:#3a8abf;color:#fff;border:none;width:100%;padding:15px;font-family:'Quicksand',sans-serif;font-size:10px;font-weight:600;letter-spacing:4px;text-transform:uppercase;cursor:pointer;margin-top:6px}
.rhdr{background:#3a8abf;padding:40px 32px;text-align:center}
.rnum{font-family:'Playfair Display',serif;font-size:72px;font-weight:400;color:#fff;line-height:1}
.rsub{font-family:'Quicksand',sans-serif;font-size:11px;letter-spacing:4px;color:rgba(255,255,255,0.7);text-transform:uppercase;margin-top:6px}
.rbody{padding:32px;text-align:center}
.rmsg{font-family:'Playfair Display',serif;font-size:26px;color:#3a8abf;margin-bottom:10px}
.rsub2{font-family:'Quicksand',sans-serif;font-size:13px;color:#888;line-height:1.6;margin-bottom:28px}
.dots{display:flex;justify-content:center;gap:8px;margin-bottom:28px}
.dot{width:10px;height:10px;border-radius:50%}
.screen{display:none}
.screen.active{display:block}
</style>
</head>
<body>
<div class="card">

  <div class="screen active" id="s-inv">
    <div class="hdr">
      <div class="subtit">XV Años</div>
      <div class="nom">Keila y Luz</div>
      <p class="tagline">¿Cuál es cuál?<br>Poné a prueba lo que sabés de ellas.</p>
    </div>
    <div class="body">
      <button class="cta" onclick="iniciarTrivia()">¡Juguemos!</button>
    </div>
  </div>

  <div class="screen" id="s-trivia">
    <div class="thdr">
      <span class="ttit">¿Cuál es cuál?</span>
      <span class="tnum" id="progNum">1 / 5</span>
    </div>
    <div class="pbar"><div class="pfill" id="pfill" style="width:0%"></div></div>
    <div class="pbody">
      <p class="ptxt" id="pregTxt"></p>
      <div id="opciones"></div>
      <button class="sig" id="btnSig" style="display:none" onclick="siguiente()">Siguiente</button>
    </div>
  </div>

  <div class="screen" id="s-res">
    <div class="rhdr">
      <div class="rnum" id="rPuntaje"></div>
      <div class="rsub">de 5 correctas</div>
    </div>
    <div class="rbody">
      <div class="dots" id="rDots"></div>
      <p class="rmsg" id="rMsg"></p>
      <p class="rsub2" id="rSub"></p>
      <button class="cta" onclick="window.location.href='https://invitarteonline.com.ar/kei-luz'">Volver a la invitación</button>
      <button class="cta2" onclick="reiniciar()">Jugar de nuevo</button>
    </div>
  </div>

</div>

<script>
const preguntas = [
  {
    p: "¿Cuál es de Boca?",
    ops: ["Keila, la más xeneize","Luz, no lo puede ocultar","Las dos son de Boca","Ninguna, son de River"],
    c: 1
  },
  {
    p: "¿Cuál es la más coqueta?",
    ops: ["Keila, siempre lista","Luz, el espejo es su mejor amiga","Las dos por igual","Ninguna, son re naturales"],
    c: 0
  },
  {
    p: "¿Cuál es la más bailarina?",
    ops: ["Keila sin parar","Luz, no hay música que la frene","Las dos igual","Ninguna, prefieren cantar"],
    c: 1
  },
  {
    p: "¿Cuál es la más dormilona?",
    ops: ["Luz, madruga sin problema","Keila, hay que llamarla mil veces","Las dos se levantan solas","Depende del día"],
    c: 1
  },
  {
    p: "¿Cuál es la más dramática?",
    ops: ["Luz, todo es un drama","Las dos por igual","Ninguna, son muy tranquilas","Keila, Oscar a mejor actriz"],
    c: 3
  },
];

let paso=0,puntaje=0,respondida=false,respuestas=[];

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function iniciarTrivia(){
  paso=0;puntaje=0;respondida=false;respuestas=[];
  renderPregunta();
  show('s-trivia');
}

function renderPregunta(){
  const q=preguntas[paso];
  document.getElementById('pregTxt').textContent=q.p;
  document.getElementById('progNum').textContent=`${paso+1} / ${preguntas.length}`;
  document.getElementById('pfill').style.width=`${(paso/preguntas.length)*100}%`;
  document.getElementById('btnSig').style.display='none';
  respondida=false;
  const cont=document.getElementById('opciones');
  cont.innerHTML='';
  q.ops.forEach((op,i)=>{
    const btn=document.createElement('button');
    btn.className='obtn';
    btn.textContent=op;
    btn.onclick=()=>elegir(i);
    cont.appendChild(btn);
  });
}

function elegir(idx){
  if(respondida)return;
  respondida=true;
  const q=preguntas[paso];
  const correcta=idx===q.c;
  if(correcta)puntaje++;
  respuestas.push(correcta);
  document.querySelectorAll('.obtn').forEach((b,i)=>{
    b.disabled=true;
    if(i===q.c)b.classList.add('ok');
    else if(i===idx&&!correcta)b.classList.add('no');
  });
  const sig=document.getElementById('btnSig');
  sig.textContent=paso<preguntas.length-1?'Siguiente':'Ver resultado';
  sig.style.display='block';
  document.getElementById('pfill').style.width=`${((paso+1)/preguntas.length)*100}%`;
}

function siguiente(){
  if(paso<preguntas.length-1){paso++;renderPregunta();}
  else{mostrarResultado();}
}

function mostrarResultado(){
  document.getElementById('rPuntaje').textContent=puntaje;
  const dots=document.getElementById('rDots');
  dots.innerHTML=respuestas.map(r=>`<div class="dot" style="background:${r?'#474f2e':'#c62828'}"></div>`).join('');
  let msg,sub;
  if(puntaje===5){msg='¡Sos casi de la familia! 🌿';sub='Las conoces de memoria. ¡A festejar!';}
  else if(puntaje>=3){msg='¡Bastante bien! ✨';sub='Casi las conoces como su mamá. Casi...';}
  else{msg='¡Hay que ponerse al día! 🫶';sub='Más razones para disfrutar la fiesta y conocerlas mejor.';}
  document.getElementById('rMsg').textContent=msg;
  document.getElementById('rSub').textContent=sub;
  show('s-res');
}

function reiniciar(){iniciarTrivia();}
</script>
</body>
</html>
